name: Verify vendored official skills

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'scripts/verify-vendored-skills.mjs'
      - '.github/workflows/verify-skills.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - 'scripts/verify-vendored-skills.mjs'
      - '.github/workflows/verify-skills.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official skill files
        run: node scripts/verify-vendored-skills.mjs
